[project]
name = "openmcpart"
version = "0.3.0"
description = "Design tools and read-only local project audit over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "design", "ui", "ux", "design-system", "color", "typography", "accessibility"]
authors = [{ name = "openmcpart", email = "hello@openmcpart.dev" }]
dependencies = [
    "mcp>=1.20.0",
    "pydantic>=2.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/hrfrutrd-dev/openmcpart"
Repository = "https://github.com/hrfrutrd-dev/openmcpart"
Issues = "https://github.com/hrfrutrd-dev/openmcpart/issues"

[project.scripts]
openmcpart = "openmcpart.server:main"
design-mcp = "openmcpart.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmcpart"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]

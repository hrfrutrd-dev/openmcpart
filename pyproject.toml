[project]
name = "openmcpart"
version = "0.2.0"
description = "Universal Design Specialist MCP Server - どんなAgentでも使えるデザイン専門MCPサーバー"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "design", "ui", "ux", "design-system", "color", "typography", "accessibility"]
authors = [{ name = "openmcpart", email = "hello@openmcpart.dev" }]
dependencies = [
    "mcp>=1.20.0",
    "pydantic>=2.0.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/hrfrutrd-dev/openmcpart"
Repository = "https://github.com/hrfrutrd-dev/openmcpart"
Issues = "https://github.com/hrfrutrd-dev/openmcpart/issues"

[project.scripts]
openmcpart = "openmcpart.server:main"
design-mcp = "openmcpart.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmcpart"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

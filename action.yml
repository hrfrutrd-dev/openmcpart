name: openmcpart design audit
description: Run a read-only static accessibility and design-token audit on a local frontend project.
inputs:
  project-path:
    description: Directory to scan, relative to the workflow workspace or an absolute path.
    required: false
    default: .
  fail-on:
    description: Fail the action when findings at this severity or higher are reported.
    required: false
    default: high
  max-files:
    description: Maximum source files to scan.
    required: false
    default: "500"
  python-version:
    description: Python version used to run openmcpart.
    required: false
    default: "3.12"
outputs:
  report:
    description: Path to the generated Markdown report.
    value: ${{ steps.audit.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install openmcpart
      shell: bash
      env:
        OPENMCPART_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install "$OPENMCPART_ACTION_PATH"
    - name: Audit frontend project
      id: audit
      shell: bash
      env:
        AUDIT_PROJECT_PATH: ${{ inputs.project-path }}
        AUDIT_FAIL_ON: ${{ inputs.fail-on }}
        AUDIT_MAX_FILES: ${{ inputs.max-files }}
      run: |
        report="$RUNNER_TEMP/openmcpart-audit.md"
        set +e
        openmcpart audit "$AUDIT_PROJECT_PATH" --format markdown --max-files "$AUDIT_MAX_FILES" --fail-on "$AUDIT_FAIL_ON" > "$report"
        status=$?
        set -e
        cat "$report"
        cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        exit "$status"
